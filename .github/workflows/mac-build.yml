# Builds the macOS app so that the packaging config is checked by a machine that
# can actually run it. Nobody here has a Mac, and electron-builder cannot produce
# a mac target from Windows, so without this the config is unverified until the
# day someone tries to release from it.
#
# It signs on a manual run and, when asked, puts the result into the draft
# release for the version in package.json. Whether it signs is not this file's
# choice: electron-builder refuses to sign a pull-request build. isSignAllowed() checks GITHUB_BASE_REF, which Actions sets only for
# `pull_request`, and returns before an identity is even looked for --
# notarisation is downstream of signing, so it is skipped along with it. The
# credentials below therefore sit unused on a PR run and do their work only on a
# manual run from the Actions tab.
#
# That is also why signing cannot be checked by opening a pull request. Use
# `workflow_dispatch`: it is the only path here that produces a bundle a Mac
# will open.
#
# Publishing is a separate job on purpose. The release token is the one credential
# here that can change what users download, and the build job runs `npm ci`,
# which executes an install script from every dependency in the tree. Those two
# should not be in the same job. Splitting them also puts the upload on a Linux
# runner, which bills at a tenth of the macOS rate for what is a download and an
# upload.
#
# This job never creates a release. tools/check-release.js explains why in its
# own words: it can repair a draft that electron-builder split, because the
# bytes are in the local dist/, but two machines landing in two drafts is a
# publishing question it cannot fix. Uploading only into a release that already
# exists means that question never gets asked. Windows makes the draft; this
# fills in the other half.
#
# Both of the answers that can be "no" are asked in a preflight job before any
# of it is paid for. Half an hour of macOS at ten times the Linux rate, spent to
# find out that the box was ticked on the wrong branch, is a guard that is right
# and useless.
name: Mac build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Upload into the draft release for the version in package.json.
          Run `npm run release` on Windows first: the draft has to exist.
        type: boolean
        default: false
  # Only when something that decides the mac bundle changes. A full Electron
  # build takes minutes of macOS runner time, which bills at ten times the
  # Linux rate, so it is not worth spending on a CSS-only pull request.
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "build/**"
      - "tools/build.js"
      # The mac invocation used to live in package.json, which is on this list.
      # It moved into tools/dist.js, and `npm run dist:mac` is only ever
      # exercised here -- so without this line a change to how the mac target is
      # chosen goes green on a pull request and breaks at release time.
      - "tools/dist.js"
      - ".github/workflows/mac-build.yml"

# The default for every job here. The one that needs more says so itself, so
# that widening it is a visible, local decision rather than something the whole
# file inherits. Without saying anything at all the token would inherit whatever
# the repository or organisation defaults to, which is usually more.
permissions:
  contents: read

concurrency:
  group: mac-build-${{ github.ref }}
  # A pull request that pushes twice should not pay for two builds, so the
  # older one goes. A manual run is different on both counts: it costs half an
  # hour and a round trip to Apple's notary, and when publish is on it is
  # writing to a release. Cancelling that mid-upload leaves a draft with some
  # of its assets -- recoverable, since check-release.js would say so and a
  # re-run clobbers its way back, but not something to invite.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # Everything that can say no to a publishing run, asked before any of it is
  # paid for. It is fifteen seconds of Linux; the build and notarisation behind
  # it are half an hour of macOS, which bills at ten times the rate. A guard
  # that only fires at the end is right and useless.
  #
  # It runs on every event and does nothing unless publishing was asked for, so
  # that `build` can depend on it without the dependency skipping `build` too.
  preflight:
    runs-on: ubuntu-latest
    permissions:
      # Write, and only to be allowed to read. GitHub shows draft releases to
      # tokens with push access and to nobody else, and the draft is the only
      # thing this job asks about -- measured on the first real publish run,
      # where `contents: read` reported "there is no release for v1.0.1" while
      # the draft was sitting there with three assets.
      #
      # The separation that matters is still kept: this job checks out and runs
      # two shell commands, and the job that runs npm ci -- install scripts from
      # every dependency in the tree -- has no token at all.
      contents: write
    steps:
      # The branch is answered by the event, so it is asked first and without
      # cloning anything.
      - name: Refuse to publish from anywhere but main
        if: inputs.publish && github.ref_name != 'main'
        run: |
          echo "publish was asked for on ${{ github.ref_name }}." >&2
          echo "The release is built from main, so this would upload a bundle" >&2
          echo "that is not what the tag points at." >&2
          exit 1

      # Only for package.json, which is what decides the tag -- the same file
      # the publish job and tools/check-release.js read, so there is nowhere for
      # a second answer to live.
      - uses: actions/checkout@v5
        if: inputs.publish
        with:
          persist-credentials: false

      # Two ways to answer no, and they are different mistakes.
      #
      # No release at all: the halves ran out of order. Windows makes the draft.
      #
      # A release that is already published: the version was not bumped. That is
      # not hypothetical -- it happened on 2026-08-10, when package.json still
      # said 1.0.6 and v1.0.6 had gone out two days earlier. Uploading there
      # would replace assets on a release people are downloading, because the
      # upload runs with --clobber. Only a draft is a safe destination.
      - name: Refuse to publish into anything but a draft
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          echo "looking for a draft release $tag"

          # The list, not /releases/tags/$tag. A draft has no git tag yet, so
          # that endpoint answers 404 for one even with a token that can see it
          # -- measured. gh release view happens to fall back to the list, but
          # asking for the list outright says what this depends on.
          state=$(gh api "repos/$GITHUB_REPOSITORY/releases"             --jq "[.[] | select(.tag_name == \"$tag\")] | first | if . == null then \"missing\" elif .draft then \"draft\" else \"published\" end")

          if [ "$state" = "missing" ]; then
            echo "there is no release for $tag." >&2
            echo "Windows makes the draft: run npm run release there first." >&2
            echo "This workflow fills in the mac half and never creates one." >&2
            exit 1
          fi

          if [ "$state" != "draft" ]; then
            echo "$tag is already published." >&2
            echo "Uploading into it would replace assets people are already" >&2
            echo "downloading. Bump the version in package.json and make a new" >&2
            echo "release; a published one is never a destination." >&2
            exit 1
          fi

          echo "found the draft -- the mac half can go in"

  build:
    needs: preflight
    runs-on: macos-latest
    env:
      # One place decides it, so the key step, the checks and the artifact name
      # cannot disagree about what this run produced. Why the answer is "a manual
      # run, and only a manual run" is in the header.
      SIGNING: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # checkout leaves the token in .git/config unless told not to, and
          # the next step is `npm ci` -- which runs install scripts from every
          # dependency in the tree. None of them has any business holding a
          # credential for this repository.
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The unit tests do not know what platform they are on, which is the
      # point: this is the first time they run anywhere but a Windows desktop,
      # and a path separator baked into one of them would show up here.
      - name: Unit tests
        run: npm test

      # notarytool wants the App Store Connect key as a *file*, so this one
      # secret cannot be handed straight to electron-builder the way CSC_LINK
      # can. It goes to RUNNER_TEMP rather than anywhere in the workspace: the
      # packager walks the working tree and the upload step globs dist/, and a
      # private key has no business being reachable by either.
      #
      # Decoded with python rather than `base64 --decode` because macOS ships
      # BSD base64, whose flags differ from GNU's, and because a secret pasted
      # out of a file may carry newlines that openssl's -A form refuses.
      - name: Put the notarisation key on disk
        if: env.SIGNING == 'true'
        id: api-key
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_B64:-}" ]; then
            echo "APPLE_API_KEY_B64 is empty -- the secret is missing." >&2
            exit 1
          fi
          key="$RUNNER_TEMP/apple-api-key.p8"
          python3 -c 'import base64,os,sys; sys.stdout.buffer.write(base64.b64decode(os.environ["APPLE_API_KEY_B64"]))' > "$key"
          chmod 600 "$key"
          # The path is not a secret; what is in the file is. Printing the size
          # makes a missing or truncated key visible in the log without any of
          # it being in the log.
          echo "wrote $(wc -c < "$key") bytes"
          echo "path=$key" >> "$GITHUB_OUTPUT"

      - name: Build the mac app
        run: npm run dist:mac
        env:
          # CSC_IDENTITY_AUTO_DISCOVERY used to be false here, to make an
          # unsigned build the explicit outcome rather than a keychain hunt that
          # fails looking like a certificate problem. It cannot stay:
          # findIdentity() returns null outright when that flag is false and no
          # CSC_NAME is set, so the keychain CSC_LINK just built would never be
          # searched. The build would succeed, unsigned, with one warning in the
          # log -- the quiet kind of wrong. Skipping is now decided by the event,
          # upstream of this step.
          #
          # CSC_LINK takes the .p12 as base64 directly, so unlike the key above
          # it never touches this disk.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # Notarisation is turned on by these three and nothing else -- there is
          # no `notarize` in package.json, because app-builder-lib reads them
          # from the environment and errors if one of the three is missing.
          # APPLE_API_KEY is the *path* written above, not the key itself.
          APPLE_API_KEY: ${{ steps.api-key.outputs.path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # The log saying "signing" and "notarization successful" is the builder's
      # own account of itself. This asks the OS instead, because the failure that
      # matters is the one where a bundle ships and Gatekeeper refuses it on a
      # stranger's machine.
      #
      # stapler is the check worth having most: notarisation is a round trip to
      # Apple, and a ticket that was issued but not stapled means every first
      # launch needs the network to go well.
      - name: Prove the bundle is signed, notarised and accepted
        if: env.SIGNING == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(dist/mac*/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "no .app under dist/ -- the build produced nothing to check." >&2
            exit 1
          fi
          for app in "${apps[@]}"; do
            echo "=== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv --verbose=4 "$app" 2>&1 | grep -E "^(Authority|TeamIdentifier|Timestamp|Signature)"
            # Notarised *and* stapled, then accepted by the policy a first launch
            # actually consults.
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          done

      # Named for what it is, so a signed bundle and an unsigned one cannot be
      # taken for each other in the artifact list. An unsigned one is good only
      # for reading the log -- Gatekeeper will refuse to open it, and
      # electron-updater refuses to update an unsigned mac app.
      - uses: actions/upload-artifact@v5
        with:
          name: mac-${{ env.SIGNING == 'true' && 'signed' || 'unsigned' }}
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist/*.blockmap
          if-no-files-found: error

      # The runner is thrown away, so this is belt and braces -- but a job that
      # fails between writing the key and finishing should not leave it sitting
      # there for whatever else runs in the same job.
      - name: Take the key back off disk
        if: always() && steps.api-key.outputs.path != ''
        run: rm -f "${{ steps.api-key.outputs.path }}"

  # Downloads what the build job just signed and puts it in the draft release.
  # On Linux because none of this needs a Mac, and macOS minutes bill at ten
  # times the rate.
  publish:
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      # The one job that writes. Kept away from `npm ci`, which is where a
      # dependency's install script would be if there were ever going to be one.
      contents: write
      # Naming any permission sets every other one to none, and reading the
      # artifact the build job left is an Actions API call, not a contents one.
      # Leaving it out is the kind of failure that reads as "the artifact is
      # missing" rather than "this job may not look".
      actions: read
    steps:
      # For tools/check-release.js and for package.json, which is what decides
      # the tag. The same file decides it inside that script, so there is no
      # second place to keep in step.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Into dist/ because that is where check-release.js looks when it has to
      # re-upload a file, and where electron-builder would have left them.
      - uses: actions/download-artifact@v5
        with:
          name: mac-signed
          path: dist

      - name: Put the mac half into the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"

          # Never create one. Windows makes the draft with `npm run release`;
          # this fills in the other half. A release made from here would be a
          # second draft for the same tag, which is the failure
          # tools/check-release.js exists to describe and cannot repair across
          # machines.
          # Asked again rather than trusted from preflight. Half an hour of
          # building and notarising sits between the two, which is long enough
          # for someone to publish the draft -- and this is the step that would
          # then overwrite it.
          if ! draft=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
            echo "no release for $tag." >&2
            echo 'Run npm run release on Windows first, then re-run this.' >&2
            exit 1
          fi
          if [ "$draft" != "true" ]; then
            echo "$tag was a draft when this run started and is published now." >&2
            echo "Not uploading: --clobber would replace its assets." >&2
            exit 1
          fi

          ls -l dist
          # --clobber so a re-run replaces its own files rather than failing on
          # the second attempt.
          gh release upload "$tag" \
            dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml \
            --clobber

      # Asks the assembled draft whether it is a release, rather than trusting
      # that two machines each did their half. It knows what each platform owns
      # and needs -- including that latest-mac.yml is the feed, and that a zip
      # without its blockmap costs every mac user a full download.
      - name: Check the draft is a whole release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/check-release.js
